<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Vodič za goste · uvale, rute i vjetar oko Biograda i Kornata</title>
<meta name="description" content="Karta Jadrana s uvalama, plažama, restoranima, sidrištima, marinama i pumpama, rute po moru s nautičkim miljama i gorivom, planer izleta i prognoza vjetra i valova.">
<link rel="canonical" href="https://jukic-charter-novi.pages.dev/vodic/">
<meta name="theme-color" content="#06324f">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="../img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../img/icon-192.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preload" href="../fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="../css/guide.css">
</head>
<body>
<div class="app" id="app">
  <h1 class="sr-only" data-t="appTitle">Vodič za goste</h1>
  <div id="map" class="map" role="region" aria-label="Karta"></div>

  <header class="top">
    <a class="top__brand" href="../" data-t-title="toSite">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 21c4 0 4-3 8-3s4 3 8 3 4-3 8-3"/><path d="M8 15 16 4l8 11z"/></svg>
      <span data-brand></span>
    </a>
    <button class="wx-pill" type="button" data-wx-pill aria-live="polite">
      <span class="wx-pill__dot"></span><span data-wx-pill-text>…</span>
    </button>
    <div class="top__tools">
      <button class="icon-btn" type="button" data-open-layers data-t-aria="layers"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
      <button class="icon-btn icon-btn--text" type="button" data-lang></button>
    </div>
  </header>

  <div class="map-tools">
    <button class="fab" type="button" data-locate data-t-aria="locate"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg></button>
  </div>

  <div class="timebar" data-timebar hidden>
    <div class="timebar__days" data-tb-days role="tablist"></div>
    <div class="timebar__row">
      <input type="range" min="0" max="23" step="1" data-tb-hour data-t-aria="hour">
      <output data-tb-out></output>
    </div>
    <div class="timebar__legend" data-tb-legend></div>
  </div>

  <section class="sheet" id="sheet" data-snap="peek" aria-label="Vodič">
    <div class="sheet__grab" data-grab>
      <span class="sheet__handle" aria-hidden="true"></span>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="explore" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><span data-t="tExplore"></span></button>
        <button role="tab" data-tab="routes" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8 18h6a3.5 3.5 0 0 0 0-7h-4a3.5 3.5 0 0 1 0-7h6"/></svg><span data-t="tRoutes"></span></button>
        <button role="tab" data-tab="plan" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span data-t="tPlan"></span><b class="tabs__badge" data-plan-count hidden></b></button>
        <button role="tab" data-tab="weather" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></svg><span data-t="tWeather"></span></button>
      </div>
    </div>
    <div class="sheet__body" data-sheet-body>
      <div class="panel" data-panel="explore"></div>
      <div class="panel" data-panel="routes" hidden></div>
      <div class="panel" data-panel="plan" hidden></div>
      <div class="panel" data-panel="weather" hidden></div>
      <div class="panel" data-panel="place" hidden></div>
    </div>
  </section>

  <div class="layers" data-layers hidden role="dialog" aria-modal="true" aria-labelledby="layers-title">
    <div class="layers__scrim" data-close-layers></div>
    <div class="layers__card">
      <h2 id="layers-title" data-t="layers"></h2>
      <div class="seg2" role="radiogroup">
        <label><input type="radio" name="mode" value="featured" checked><span data-t="modeFeatured"></span></label>
        <label><input type="radio" name="mode" value="all"><span data-t="modeAll"></span></label>
      </div>
      <p class="hint" data-t="modeHint"></p>
      <div class="cats" data-cats></div>
      <h3 data-t="overlays"></h3>
      <div class="seg2 seg2--3" role="radiogroup">
        <label><input type="radio" name="ov" value="none" checked><span data-t="ovNone"></span></label>
        <label><input type="radio" name="ov" value="wind"><span data-t="ovWind"></span></label>
        <label><input type="radio" name="ov" value="waves"><span data-t="ovWaves"></span></label>
      </div>
      <label class="switch"><input type="checkbox" data-seamarks><span data-t="seamarks"></span></label>
      <button class="btn btn--block" type="button" data-close-layers data-t="done"></button>
    </div>
  </div>

  <div class="toast" data-toast role="status" aria-live="polite" hidden></div>
</div>

<script>
  // Dev only: ?rafpoly drives animation frames from timers, for headless/background previews.
  if (/[?&]rafpoly/.test(location.search)) window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
</script>
<script src="../js/config.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="../js/router.js"></script>
<script src="../js/guide-i18n.js"></script>
<script src="../js/weather.js"></script>
<script src="../js/guide.js"></script>
</body>
</html>
